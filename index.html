<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebADB Console</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151e2e;
            --card-sub: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --accent: #2563eb;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 0.75rem;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid var(--border);
        }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        h1 { font-size: 1.15rem; font-weight: 600; }
        .lang-btn {
            background: var(--card-sub);
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;
        }
        .status-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 20px;
            background: var(--card-sub);
            color: var(--text-dim);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #64748b; }
        .connected .status-badge { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .connected .status-dot { background: var(--success); }

        .device-info-card {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: var(--card-sub);
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 0.75rem;
            border: 1px solid var(--border);
            font-size: 0.75rem;
        }
        .info-item { display: flex; flex-direction: column; }
        .info-label { color: var(--text-dim); font-size: 0.65rem; }
        .info-val { color: #38bdf8; font-weight: 600; font-family: ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .btn-connect {
            width: 100%;
            padding: 11px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 0.75rem;
            transition: opacity 0.15s;
        }
        .btn-connect:active { opacity: 0.85; }

        .field-label { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 4px; display: block; }
        
        select {
            width: 100%;
            padding: 10px;
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #38bdf8;
            font-size: 0.85rem;
            outline: none;
            margin-bottom: 0.75rem;
        }

        .cmd-row {
            display: flex;
            gap: 6px;
            margin-bottom: 0.75rem;
        }
        .cmd-input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-family: ui-monospace, monospace;
            font-size: 0.85rem;
            outline: none;
        }
        .cmd-input:focus { border-color: #38bdf8; }

        .btn-exec {
            padding: 0 16px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: opacity 0.15s;
        }
        .btn-exec:active { opacity: 0.85; }

        .term-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-size: 0.75rem;
            color: var(--text-dim);
        }
        #logs {
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            height: 250px;
            overflow-y: auto;
            font-family: ui-monospace, monospace;
            font-size: 0.72rem;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-item { margin-bottom: 3px; }
        .log-time { color: #64748b; margin-right: 5px; }
        .log-info { color: #94a3b8; }
        .log-succ { color: #34d399; }
        .log-warn { color: #fbbf24; }
        .log-err { color: #f87171; }
        .log-cmd { color: #38bdf8; font-weight: 600; }

        dialog {
            margin: auto;
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            max-width: 90%;
            width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.6);
        }
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(2px);
        }
        dialog h3 { font-size: 1.05rem; margin-bottom: 0.75rem; font-weight: 600; }
        dialog p { font-size: 0.8rem; line-height: 1.5; color: #cbd5e1; margin-bottom: 0.6rem; }
        dialog ul { font-size: 0.75rem; color: var(--text-dim); margin-left: 1.2rem; margin-bottom: 1rem; line-height: 1.5; }
        .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .dialog-actions button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-disagree { background: #334155; color: #cbd5e1; }
        .btn-agree { background: var(--accent); color: #fff; }
    </style>
</head>
<body>

<div class="container" id="app">
    <header>
        <h1 id="txtTitle">WebADB 控制台</h1>
        <div style="display: flex; align-items: center; gap: 8px;">
            <button id="langToggleBtn" class="lang-btn">English</button>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span id="statusText">未连接</span>
            </div>
        </div>
    </header>

    <button id="connectBtn" class="btn-connect">连接设备 (WebUSB)</button>

    <div id="deviceInfoCard" class="device-info-card">
        <div class="info-item">
            <span class="info-label" id="lblModel">设备型号</span>
            <span id="infoModel" class="info-val">-</span>
        </div>
        <div class="info-item">
            <span class="info-label" id="lblAndroid">系统版本</span>
            <span id="infoAndroid" class="info-val">-</span>
        </div>
        <div class="info-item">
            <span class="info-label" id="lblBattery">电池状态</span>
            <span id="infoBattery" class="info-val">-</span>
        </div>
        <div class="info-item">
            <span class="info-label" id="lblSelinux">SELinux 状态</span>
            <span id="infoSelinux" class="info-val">-</span>
        </div>
    </div>

    <label class="field-label" id="lblPreset">常用命令预设 (选择自动填入)：</label>
    <select id="presetSelect">
        <option value="" selected disabled id="optPresetDefault">-- 点击选择命令预设 --</option>
        <optgroup label="框架与特权激活" id="grpFramework">
            <option value="action:shizuku" id="optShizuku">自动寻找并启动 Shizuku</option>
            <option value="dpm set-device-owner com.rosan.dhizuku/.server.DhizukuDAReceiver">激活 Dhizuku (Device Owner)</option>
            <option value="dpm set-device-owner com.aistra.hail/.receiver.DeviceAdminReceiver">激活 雹 Hail (Device Owner)</option>
            <option value="dpm set-device-owner web1n.stopapp/.receiver.AdminReceiver">激活 小黑屋 (Device Owner)</option>
            <option value="dpm set-device-owner com.catchingnow.icebox/.receiver.DPMReceiver">激活 冰箱 IceBox (Device Owner)</option>
            <option value="sh /data/data/me.piebridge.brevent/brevent.sh">激活 黑阈 Brevent</option>
            <option value="sh /data/system/thanos/start.sh">激活 Thanox 淘米</option>
        </optgroup>
        <optgroup label="网络与调试" id="grpNetwork">
            <option value="setprop service.adb.tcp.port 5555" id="optTcpipOn">开启 5555 端口无线调试</option>
            <option value="setprop service.adb.tcp.port -1" id="optTcpipOff">关闭无线调试端口</option>
        </optgroup>
        <optgroup label="系统与诊断" id="grpSystem">
            <option value="pm list packages -3" id="optPkgs">查看第三方应用包名</option>
            <option value="dumpsys battery" id="optBattery">查看电池健康与温度</option>
            <option value="wm size" id="optResolution">查看屏幕物理分辨率</option>
        </optgroup>
        <optgroup label="电源管理" id="grpPower">
            <option value="reboot" id="optReboot">重启设备</option>
            <option value="reboot recovery" id="optRecovery">重启至 Recovery 模式</option>
            <option value="reboot bootloader" id="optBootloader">重启至 Bootloader / Fastboot</option>
        </optgroup>
    </select>

    <label class="field-label" id="lblConsole">命令控制台 (支持回车执行)：</label>
    <div class="cmd-row">
        <input type="text" id="cmdInput" class="cmd-input" placeholder="输入或粘贴 ADB 命令 (自动过滤 adb shell)" />
        <button id="execBtn" class="btn-exec">执行</button>
    </div>

    <div class="term-header">
        <span id="lblLogs">终端执行日志</span>
        <span style="cursor:pointer;" id="clearBtn">[清空]</span>
    </div>
    <div id="logs"></div>
</div>

<dialog id="disclaimerModal">
    <h3 id="txtModalTitle">免责与安全声明</h3>
    <p id="txtModalDesc">在使用本控制台前，请仔细阅读以下声明：</p>
    <ul>
        <li id="txtModalPriv"><strong>本地执行：</strong>本工具为 100% 纯前端浏览器本地运行，绝不上报或中转您的任何设备数据与个人隐私。</li>
        <li id="txtModalRisk"><strong>特权风险：</strong>ADB 具备系统高阶调试权限，请谨慎执行自定义命令。因用户自行执行命令造成的任何异常，开发者概不负责。</li>
    </ul>
    <div class="dialog-actions">
        <button id="disagreeBtn" class="btn-disagree">取消</button>
        <button id="agreeBtn" class="btn-agree">已知晓并同意</button>
    </div>
</dialog>

<script type="module">
    import { AdbDaemonWebUsbDeviceManager } from "https://esm.sh/@yume-chan/adb-daemon-webusb@2.1.0";
    import AdbWebCredentialStore from "https://esm.sh/@yume-chan/adb-credential-web@2.1.0";
    import { Adb, AdbDaemonTransport } from "https://esm.sh/@yume-chan/adb@2.1.0";

    // -------------------------------------------------------------
    // 现代化轻量 i18n 字典系统（单文件双语无缝切换）
    // -------------------------------------------------------------
    const I18N = {
        zh: {
            title: "WebADB 控制台",
            langBtn: "English",
            notConnected: "未连接",
            connected: "已连接: ",
            btnConnect: "连接设备 (WebUSB)",
            lblModel: "设备型号",
            lblAndroid: "系统版本",
            lblBattery: "电池状态",
            lblSelinux: "SELinux 状态",
            lblPreset: "常用命令预设 (选择自动填入)：",
            optPresetDefault: "-- 点击选择命令预设 --",
            grpFramework: "框架与特权激活",
            optShizuku: "自动寻找并启动 Shizuku",
            grpNetwork: "网络与调试",
            optTcpipOn: "开启 5555 端口无线调试",
            optTcpipOff: "关闭无线调试端口",
            grpSystem: "系统与诊断",
            optPkgs: "查看第三方应用包名",
            optBattery: "查看电池健康与温度",
            optResolution: "查看屏幕物理分辨率",
            grpPower: "电源管理",
            optReboot: "重启设备",
            optRecovery: "重启至 Recovery 模式",
            optBootloader: "重启至 Bootloader / Fastboot",
            lblConsole: "命令控制台 (支持回车执行)：",
            placeholder: "输入或粘贴 ADB 命令 (自动过滤 adb shell)",
            btnExec: "执行",
            lblLogs: "终端执行日志",
            btnClear: "[清空]",
            modalTitle: "免责与安全声明",
            modalDesc: "在使用本控制台前，请仔细阅读以下声明：",
            modalPriv: "<strong>本地执行：</strong>本工具为 100% 纯前端浏览器本地运行，绝不上报或中转您的任何设备数据与个人隐私。",
            modalRisk: "<strong>特权风险：</strong>ADB 具备系统高阶调试权限，请谨慎执行自定义命令。因用户自行执行命令造成的任何异常，开发者概不负责。",
            btnDisagree: "取消",
            btnAgree: "已知晓并同意",
            msgReady: "控制台已就绪，请点击上方【连接设备】开始。",
            msgNoWebUsb: "当前浏览器不支持 WebUSB，请使用 Chrome 或 Edge 浏览器！",
            msgCancelSelect: "已取消设备选择。",
            msgAllowDebug: "若手机弹出“允许 USB 调试”，请在手机上点击“确定”。",
            msgConnectFail: "连接失败: ",
            msgDisconnect: "设备已断开连接。",
            msgAuthCancel: "已取消连接授权。",
            msgEmptyInput: "请输入或选择要执行的命令！",
            msgSearchingShizuku: "正在多重检索 Shizuku 安装路径...",
            msgShizukuNotFound: "未检测到安装的 Shizuku，请先在手机上安装该应用。",
            msgShizukuSoNotFound: "未能定位 libshizuku.so，建议更新 Shizuku 版本。",
            msgShizukuSuccess: "Shizuku 启动成功！",
            msgNoOutput: "(命令已执行完毕，无返回输出)",
            msgExecError: "执行异常: "
        },
        en: {
            title: "WebADB Console",
            langBtn: "中文",
            notConnected: "Disconnected",
            connected: "Connected: ",
            btnConnect: "Connect Device (WebUSB)",
            lblModel: "Model",
            lblAndroid: "Android OS",
            lblBattery: "Battery",
            lblSelinux: "SELinux",
            lblPreset: "Preset Commands (Select to autofill):",
            optPresetDefault: "-- Select preset command --",
            grpFramework: "Frameworks & Activation",
            optShizuku: "Auto-detect & Start Shizuku",
            grpNetwork: "Network & Debugging",
            optTcpipOn: "Enable TCP/IP on Port 5555",
            optTcpipOff: "Disable TCP/IP",
            grpSystem: "System & Diagnostics",
            optPkgs: "List 3rd-party installed packages",
            optBattery: "Dump battery health & status",
            optResolution: "Display physical resolution",
            grpPower: "Power Management",
            optReboot: "Reboot Device",
            optRecovery: "Reboot to Recovery",
            optBootloader: "Reboot to Bootloader / Fastboot",
            lblConsole: "Console Command (Press Enter to run):",
            placeholder: "Type command (adb shell prefix is auto-trimmed)",
            btnExec: "Run",
            lblLogs: "Terminal Logs",
            btnClear: "[Clear]",
            modalTitle: "Disclaimer & Safety",
            modalDesc: "Please review before proceeding:",
            modalPriv: "<strong>Local Execution:</strong> Runs 100% locally in your browser. No telemetry or personal data are collected or transferred.",
            modalRisk: "<strong>Privilege Risk:</strong> ADB grants low-level device control. Execute commands at your own risk. The developer is not liable for system malfunctions.",
            btnDisagree: "Cancel",
            btnAgree: "I Understand & Agree",
            msgReady: "Console ready. Tap [Connect Device] to begin.",
            msgNoWebUsb: "WebUSB is not supported in this browser. Please use Chrome or Edge.",
            msgCancelSelect: "Device selection cancelled.",
            msgAllowDebug: "If prompted on device, please tap \"Allow USB debugging\".",
            msgConnectFail: "Connection failed: ",
            msgDisconnect: "Device disconnected.",
            msgAuthCancel: "Device connection cancelled.",
            msgEmptyInput: "Please enter or select a command.",
            msgSearchingShizuku: "Locating Shizuku installation directory across standard paths...",
            msgShizukuNotFound: "Shizuku package not found on device.",
            msgShizukuSoNotFound: "Could not locate libshizuku.so. Please update Shizuku.",
            msgShizukuSuccess: "Shizuku started successfully!",
            msgNoOutput: "(Command executed with no output)",
            msgExecError: "Execution error: "
        }
    };

    let currentLang = localStorage.getItem('webadb_lang') || 
                      (navigator.language && navigator.language.toLowerCase().startsWith('zh') ? 'zh' : 'en');

    function applyLang(lang) {
        currentLang = lang;
        localStorage.setItem('webadb_lang', lang);
        const t = I18N[lang];

        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        document.getElementById('txtTitle').textContent = t.title;
        document.getElementById('langToggleBtn').textContent = t.langBtn;
        if (!device) document.getElementById('statusText').textContent = t.notConnected;
        document.getElementById('connectBtn').textContent = t.btnConnect;
        document.getElementById('lblModel').textContent = t.lblModel;
        document.getElementById('lblAndroid').textContent = t.lblAndroid;
        document.getElementById('lblBattery').textContent = t.lblBattery;
        document.getElementById('lblSelinux').textContent = t.lblSelinux;
        document.getElementById('lblPreset').textContent = t.lblPreset;
        document.getElementById('optPresetDefault').textContent = t.optPresetDefault;
        document.getElementById('grpFramework').label = t.grpFramework;
        document.getElementById('optShizuku').textContent = t.optShizuku;
        document.getElementById('grpNetwork').label = t.grpNetwork;
        document.getElementById('optTcpipOn').textContent = t.optTcpipOn;
        document.getElementById('optTcpipOff').textContent = t.optTcpipOff;
        document.getElementById('grpSystem').label = t.grpSystem;
        document.getElementById('optPkgs').textContent = t.optPkgs;
        document.getElementById('optBattery').textContent = t.optBattery;
        document.getElementById('optResolution').textContent = t.optResolution;
        document.getElementById('grpPower').label = t.grpPower;
        document.getElementById('optReboot').textContent = t.optReboot;
        document.getElementById('optRecovery').textContent = t.optRecovery;
        document.getElementById('optBootloader').textContent = t.optBootloader;
        document.getElementById('lblConsole').textContent = t.lblConsole;
        document.getElementById('cmdInput').placeholder = t.placeholder;
        document.getElementById('execBtn').textContent = t.btnExec;
        document.getElementById('lblLogs').textContent = t.lblLogs;
        document.getElementById('clearBtn').textContent = t.btnClear;
        document.getElementById('txtModalTitle').textContent = t.modalTitle;
        document.getElementById('txtModalDesc').textContent = t.modalDesc;
        document.getElementById('txtModalPriv').innerHTML = t.modalPriv;
        document.getElementById('txtModalRisk').innerHTML = t.modalRisk;
        document.getElementById('disagreeBtn').textContent = t.btnDisagree;
        document.getElementById('agreeBtn').textContent = t.btnAgree;
    }

    document.getElementById('langToggleBtn').onclick = () => {
        applyLang(currentLang === 'zh' ? 'en' : 'zh');
    };

    // 初始化语言
    applyLang(currentLang);

    // -------------------------------------------------------------
    // DOM 元素与状态管理
    // -------------------------------------------------------------
    const app = document.getElementById('app');
    const statusText = document.getElementById('statusText');
    const deviceInfoCard = document.getElementById('deviceInfoCard');
    const infoModel = document.getElementById('infoModel');
    const infoAndroid = document.getElementById('infoAndroid');
    const infoBattery = document.getElementById('infoBattery');
    const infoSelinux = document.getElementById('infoSelinux');

    const connectBtn = document.getElementById('connectBtn');
    const presetSelect = document.getElementById('presetSelect');
    const cmdInput = document.getElementById('cmdInput');
    const execBtn = document.getElementById('execBtn');
    const clearBtn = document.getElementById('clearBtn');
    const logs = document.getElementById('logs');

    const disclaimerModal = document.getElementById('disclaimerModal');
    const agreeBtn = document.getElementById('agreeBtn');
    const disagreeBtn = document.getElementById('disagreeBtn');

    let adb = null;
    let device = null;
    let isAgreed = localStorage.getItem('adb_disclaimer_agreed') === 'true';

    // 安全日志输出：杜绝 DOM XSS 漏洞
    function log(msg, type = 'info') {
        const time = new Date().toLocaleTimeString();
        const div = document.createElement('div');
        div.className = `log-item log-${type}`;
        
        const timeSpan = document.createElement('span');
        timeSpan.className = 'log-time';
        timeSpan.textContent = `[${time}] `;
        
        const msgSpan = document.createElement('span');
        msgSpan.textContent = msg;
        
        div.appendChild(timeSpan);
        div.appendChild(msgSpan);
        logs.appendChild(div);
        logs.scrollTop = logs.scrollHeight;
    }

    clearBtn.onclick = () => { logs.innerHTML = ''; };

    function ensureAgreed(callback) {
        if (isAgreed) {
            callback();
        } else {
            disclaimerModal.showModal();
            agreeBtn.onclick = () => {
                isAgreed = true;
                localStorage.setItem('adb_disclaimer_agreed', 'true');
                disclaimerModal.close();
                callback();
            };
            disagreeBtn.onclick = () => {
                disclaimerModal.close();
                log(I18N[currentLang].msgAuthCancel, 'warn');
            };
        }
    }

    // ADB 基础执行器
    async function execute(command) {
        if (!adb) {
            log(I18N[currentLang].msgReady, 'warn');
            return null;
        }

        let cleanCmd = command.trim();
        if (cleanCmd.startsWith('adb shell ')) {
            cleanCmd = cleanCmd.replace(/^adb\s+shell\s+/, '');
        } else if (cleanCmd.startsWith('adb ')) {
            cleanCmd = cleanCmd.replace(/^adb\s+/, '');
        }

        try {
            if (adb.subprocess.shellProtocol?.isSupported) {
                const res = await adb.subprocess.shellProtocol.spawnWaitText(cleanCmd);
                return res.stdout || res.stderr || '';
            } else {
                const process = await adb.subprocess.noneProtocol.spawn(cleanCmd);
                const reader = process.stdout.getReader();
                const decoder = new TextDecoder();
                let output = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    output += decoder.decode(value, { stream: true });
                }
                return output;
            }
        } catch (err) {
            log(`${I18N[currentLang].msgExecError}${err.message}`, 'err');
            return null;
        }
    }

    // 多重 Fallback 稳健定位并启动 Shizuku (解决 Toybox/精简版 Linux find 缺失问题)
    async function runShizukuSmart() {
        const t = I18N[currentLang];
        log(t.msgSearchingShizuku, 'info');
        const pathRes = await execute('pm path moe.shizuku.privileged.api');
        const match = pathRes && pathRes.match(/package:(.+)\/base\.apk/);
        
        if (!match) {
            log(t.msgShizukuNotFound, 'warn');
            return;
        }

        const apkDir = match[1].trim();
        let soPath = '';

        // 1. 尝试直接探测 ABI 常见固定路径
        const candidatePaths = [
            `${apkDir}/lib/arm64/libshizuku.so`,
            `${apkDir}/lib/arm/libshizuku.so`,
            `${apkDir}/lib/x86_64/libshizuku.so`,
            `${apkDir}/lib/x86/libshizuku.so`
        ];

        for (const p of candidatePaths) {
            const check = (await execute(`ls ${p} 2>/dev/null`) || '').trim();
            if (check && check.endsWith('libshizuku.so')) {
                soPath = p;
                break;
            }
        }

        // 2. Fallback: 使用通配符 ls
        if (!soPath) {
            const lsCheck = (await execute(`ls ${apkDir}/lib/*/libshizuku.so 2>/dev/null`) || '').trim();
            if (lsCheck && lsCheck.includes('libshizuku.so')) {
                soPath = lsCheck.split('\n')[0].trim();
            }
        }

        // 3. Fallback: 使用 find
        if (!soPath) {
            const findCheck = (await execute(`find ${apkDir} -name "libshizuku.so" 2>/dev/null`) || '').trim();
            if (findCheck && findCheck.includes('libshizuku.so')) {
                soPath = findCheck.split('\n')[0].trim();
            }
        }

        if (!soPath) {
            log(t.msgShizukuSoNotFound, 'warn');
            return;
        }

        log(`> ${soPath}`, 'cmd');
        const out = await execute(soPath);
        if (out && out.includes('shizuku_server pid is')) {
            log(out.trim(), 'succ');
            log(t.msgShizukuSuccess, 'succ');
        } else {
            log(out ? out.trim() : t.msgNoOutput, 'info');
        }
    }

    // 自动抓取硬件看板信息
    async function loadDeviceInfo() {
        try {
            const manufacturer = (await execute('getprop ro.product.manufacturer') || '').trim();
            const model = (await execute('getprop ro.product.model') || '').trim();
            const release = (await execute('getprop ro.build.version.release') || '').trim();
            const sdk = (await execute('getprop ro.build.version.sdk') || '').trim();
            const selinux = (await execute('getenforce') || '').trim();
            const batteryDump = await execute('dumpsys battery') || '';
            
            let levelMatch = batteryDump.match(/level:\s*(\d+)/);
            let batteryStr = levelMatch ? `${levelMatch[1]}%` : (currentLang === 'zh' ? '正常' : 'Normal');

            infoModel.innerText = `${manufacturer} ${model}`.trim() || (currentLang === 'zh' ? '未知设备' : 'Unknown Device');
            infoAndroid.innerText = `Android ${release} (API ${sdk})`;
            infoBattery.innerText = batteryStr;
            infoSelinux.innerText = selinux || (currentLang === 'zh' ? '未知' : 'Unknown');

            deviceInfoCard.style.display = 'grid';
        } catch (e) {
            console.error(e);
        }
    }

    // WebUSB 连接
    async function doConnect() {
        const t = I18N[currentLang];
        if (!navigator.usb) {
            log(t.msgNoWebUsb, 'err');
            return;
        }
        try {
            device = await AdbDaemonWebUsbDeviceManager.BROWSER?.requestDevice();
            if (!device) return log(t.msgCancelSelect, 'warn');

            const connection = await device.connect();
            const credentialStore = new AdbWebCredentialStore();
            const transport = await AdbDaemonTransport.authenticate({
                serial: device.serial,
                connection: connection,
                credentialStore: credentialStore,
            });

            adb = new Adb(transport);
            const devName = (device.raw?.manufacturerName || 'Android') + ' ' + (device.raw?.productName || 'Device');
            
            app.classList.add('connected');
            statusText.innerText = `${t.connected}${devName}`;
            log(`${t.connected}${devName}`, 'succ');
            log(t.msgAllowDebug, 'warn');

            await loadDeviceInfo();
        } catch (err) {
            log(`${t.msgConnectFail}${err.message}`, 'err');
            adb = null;
            app.classList.remove('connected');
            statusText.innerText = t.notConnected;
            deviceInfoCard.style.display = 'none';
        }
    }

    connectBtn.onclick = () => ensureAgreed(doConnect);

    // 执行按钮分发
    async function handleExec() {
        const t = I18N[currentLang];
        const val = cmdInput.value.trim();
        if (!val) {
            log(t.msgEmptyInput, 'warn');
            return;
        }

        if (!adb) {
            ensureAgreed(doConnect);
            return;
        }

        // 解耦的动作判定
        const isShizukuAction = cmdInput.dataset.action === 'shizuku' || 
                                val === 'shizuku start' || 
                                val.toLowerCase() === 'shizuku';

        if (isShizukuAction) {
            await runShizukuSmart();
            return;
        }

        log(`> ${val}`, 'cmd');
        const res = await execute(val);
        if (res !== null) {
            if (res.trim()) {
                log(res.trim(), 'succ');
            } else {
                log(t.msgNoOutput, 'info');
            }
        }
    }

    execBtn.onclick = handleExec;
    cmdInput.onkeydown = (e) => { if (e.key === 'Enter') handleExec(); };

    // 用户在输入框按键修改时，立即解除预设 Action 绑定
    cmdInput.oninput = () => {
        delete cmdInput.dataset.action;
    };

    // 下拉预设选择处理
    presetSelect.onchange = () => {
        const val = presetSelect.value;
        if (!val) return;
        
        if (val === 'action:shizuku') {
            cmdInput.dataset.action = 'shizuku';
            cmdInput.value = 'shizuku start';
        } else {
            delete cmdInput.dataset.action;
            cmdInput.value = val;
        }
        cmdInput.focus();
    };

    // 监听 USB 物理拔出事件
    if (navigator.usb) {
        navigator.usb.addEventListener("disconnect", (e) => {
            if (device && e.device === device.raw) {
                adb = null;
                device = null;
                app.classList.remove('connected');
                statusText.innerText = I18N[currentLang].notConnected;
                deviceInfoCard.style.display = 'none';
                log(I18N[currentLang].msgDisconnect, 'warn');
            }
        });
    }

    log(I18N[currentLang].msgReady, 'info');
</script>
