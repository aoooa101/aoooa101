<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebADB 控制台</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151e2e;
            --card-sub: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --accent: #2563eb;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 0.75rem;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid var(--border);
        }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        h1 { font-size: 1.15rem; font-weight: 600; }
        .lang-btn {
            background: var(--card-sub);
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }
        .lang-btn:hover { border-color: var(--accent); }
        .gh-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            text-decoration: none;
            padding: 3px;
            border-radius: 6px;
            transition: color 0.15s;
        }
        .gh-link:hover { color: var(--text); }
        .status-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 20px;
            background: var(--card-sub);
            color: var(--text-dim);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #64748b; }
        .connected .status-badge { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .connected .status-dot { background: var(--success); }

        .device-info-card {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: var(--card-sub);
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 0.75rem;
            border: 1px solid var(--border);
            font-size: 0.75rem;
        }
        .info-item { display: flex; flex-direction: column; }
        .info-label { color: var(--text-dim); font-size: 0.65rem; }
        .info-val { color: #38bdf8; font-weight: 600; font-family: ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .btn-connect {
            width: 100%;
            padding: 11px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 0.75rem;
            transition: opacity 0.15s;
        }
        .btn-connect:active { opacity: 0.85; }

        .field-label { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 4px; display: block; }
        
        select {
            width: 100%;
            padding: 10px;
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #38bdf8;
            font-size: 0.85rem;
            outline: none;
            margin-bottom: 0.75rem;
        }

        .cmd-row {
            display: flex;
            gap: 6px;
            margin-bottom: 0.75rem;
        }
        .cmd-input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-family: ui-monospace, monospace;
            font-size: 0.85rem;
            outline: none;
        }
        .cmd-input:focus { border-color: #38bdf8; }

        .btn-exec {
            padding: 0 16px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: opacity 0.15s;
        }
        .btn-exec:active { opacity: 0.85; }

        .term-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-size: 0.75rem;
            color: var(--text-dim);
        }
        #logs {
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            height: 250px;
            overflow-y: auto;
            font-family: ui-monospace, monospace;
            font-size: 0.72rem;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-item { margin-bottom: 3px; }
        .log-time { color: #64748b; margin-right: 5px; }
        .log-info { color: #94a3b8; }
        .log-succ { color: #34d399; }
        .log-warn { color: #fbbf24; }
        .log-err { color: #f87171; }
        .log-cmd { color: #38bdf8; font-weight: 600; }

        dialog {
            margin: auto;
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            max-width: 90%;
            width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.6);
        }
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(2px);
        }
        dialog h3 { font-size: 1.05rem; margin-bottom: 0.75rem; font-weight: 600; }
        dialog p { font-size: 0.8rem; line-height: 1.5; color: #cbd5e1; margin-bottom: 0.6rem; }
        dialog ul { font-size: 0.75rem; color: var(--text-dim); margin-left: 1.2rem; margin-bottom: 1rem; line-height: 1.5; }
        .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .dialog-actions button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-disagree { background: #334155; color: #cbd5e1; }
        .btn-agree { background: var(--accent); color: #fff; }
    </style>
</head>
<body>

<div class="container" id="app">
    <header>
        <h1 data-en="WebADB Console">WebADB 控制台</h1>
        <div style="display: flex; align-items: center; gap: 8px;">
            <a href="https://github.com/aoooa101/aoooa101" target="_blank" rel="noopener noreferrer" class="gh-link" title="GitHub Repository" aria-label="GitHub Repository">
                <svg height="18" width="18" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                </svg>
            </a>
            <button id="langToggleBtn" class="lang-btn">English</button>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span id="statusText" data-en="Disconnected">未连接</span>
            </div>
        </div>
    </header>

    <button id="connectBtn" class="btn-connect" data-en="Connect Device (WebUSB)">连接设备 (WebUSB)</button>

    <div id="deviceInfoCard" class="device-info-card">
        <div class="info-item">
            <span class="info-label" data-en="Model">设备型号</span>
            <span id="infoModel" class="info-val">-</span>
        </div>
        <div class="info-item">
            <span class="info-label" data-en="Android OS">系统版本</span>
            <span id="infoAndroid" class="info-val">-</span>
        </div>
        <div class="info-item">
            <span class="info-label" data-en="Battery">电池状态</span>
            <span id="infoBattery" class="info-val">-</span>
        </div>
        <div class="info-item">
            <span class="info-label" data-en="SELinux">SELinux 状态</span>
            <span id="infoSelinux" class="info-val">-</span>
        </div>
    </div>

    <label class="field-label" data-en="Preset Commands (Select to autofill):">常用命令预设 (选择自动填入)：</label>
    <select id="presetSelect">
        <option value="" selected disabled data-en="-- Select preset command --">-- 点击选择命令预设 --</option>
        <optgroup label="框架与特权激活" data-en-label="Frameworks & Activation">
            <option value="action:shizuku" data-en="Auto-detect & Start Shizuku">自动寻找并启动 Shizuku</option>
            <option value="dpm set-device-owner com.rosan.dhizuku/.server.DhizukuDAReceiver" data-en="Activate Dhizuku (Device Owner)">激活 Dhizuku (Device Owner)</option>
            <option value="dpm set-device-owner com.aistra.hail/.receiver.DeviceAdminReceiver" data-en="Activate Hail (Device Owner)">激活 雹 Hail (Device Owner)</option>
            <option value="dpm set-device-owner web1n.stopapp/.receiver.AdminReceiver" data-en="Activate StopApp (Device Owner)">激活 小黑屋 (Device Owner)</option>
            <option value="dpm set-device-owner com.catchingnow.icebox/.receiver.DPMReceiver" data-en="Activate IceBox (Device Owner)">激活 冰箱 IceBox (Device Owner)</option>
            <option value="sh /data/data/me.piebridge.brevent/brevent.sh" data-en="Activate Brevent">激活 黑阈 Brevent</option>
            <option value="sh /data/system/thanos/start.sh" data-en="Activate Thanox">激活 Thanox 淘米</option>
        </optgroup>
        <optgroup label="网络与调试" data-en-label="Network & Debugging">
            <option value="setprop service.adb.tcp.port 5555" data-en="Enable TCP/IP on Port 5555">开启 5555 端口无线调试</option>
            <option value="setprop service.adb.tcp.port -1" data-en="Disable TCP/IP">关闭无线调试端口</option>
        </optgroup>
        <optgroup label="系统与诊断" data-en-label="System & Diagnostics">
            <option value="pm list packages -3" data-en="List 3rd-party installed packages">查看第三方应用包名</option>
            <option value="dumpsys battery" data-en="Dump battery health & status">查看电池健康与温度</option>
            <option value="wm size" data-en="Display physical resolution">查看屏幕物理分辨率</option>
        </optgroup>
        <optgroup label="电源管理" data-en-label="Power Management">
            <option value="reboot" data-en="Reboot Device">重启设备</option>
            <option value="reboot recovery" data-en="Reboot to Recovery">重启至 Recovery 模式</option>
            <option value="reboot bootloader" data-en="Reboot to Bootloader / Fastboot">重启至 Bootloader / Fastboot</option>
        </optgroup>
    </select>

    <label class="field-label" data-en="Console Command (Press Enter to run):">命令控制台 (支持回车执行)：</label>
    <div class="cmd-row">
        <input type="text" id="cmdInput" class="cmd-input" placeholder="输入或粘贴 ADB 命令 (自动过滤 adb shell)" data-en-ph="Type command (adb shell prefix is auto-trimmed)" />
        <button id="execBtn" class="btn-exec" data-en="Run">执行</button>
    </div>

    <div class="term-header">
        <span data-en="Terminal Logs">终端执行日志</span>
        <span style="cursor:pointer;" id="clearBtn" data-en="[Clear]">[清空]</span>
    </div>
    <div id="logs"></div>
</div>

<dialog id="disclaimerModal">
    <h3 data-en="Disclaimer & Safety">免责与安全声明</h3>
    <p data-en="Please review before proceeding:">在使用本控制台前，请仔细阅读以下声明：</p>
    <ul>
        <li id="txtModalPriv"><strong>本地执行：</strong>本工具为 100% 纯前端浏览器本地运行，绝不上报或中转您的任何设备数据与个人隐私。</li>
        <li id="txtModalRisk"><strong>特权风险：</strong>ADB 具备系统高阶调试权限，请谨慎执行自定义命令。因用户自行执行命令造成的任何异常，开发者概不负责。</li>
    </ul>
    <div class="dialog-actions">
        <button id="disagreeBtn" class="btn-disagree" data-en="Cancel">取消</button>
        <button id="agreeBtn" class="btn-agree" data-en="I Understand & Agree">已知晓并同意</button>
    </div>
</dialog>

<script type="module">
    // 2026-08-17 修复：
    //   1. spawnWaitText 在 v2.1.0 返回文本流 (ReadableStream) 而非 {stdout,stderr} 对象，
    //      原实现导致所有命令输出静默丢失，已改为逐块读取。
    //   2. 补充 WebUSB 管理器不可用 (非 HTTPS / 浏览器不支持) 时的明确报错。
    // 提示：若 esm.sh 加载失败 (页面点击无反应)，可将下方三个域名整体替换为
    // https://cdn.jsdelivr.net/npm/@yume-chan/<包名>@2.1.0/+esm (导出格式已验证一致)。
    import { AdbDaemonWebUsbDeviceManager } from "https://esm.sh/@yume-chan/adb-daemon-webusb@2.1.0";
    import AdbWebCredentialStore from "https://esm.sh/@yume-chan/adb-credential-web@2.1.0";
    import { Adb, AdbDaemonTransport } from "https://esm.sh/@yume-chan/adb@2.1.0";

    // -------------------------------------------------------------
    // 现代声明式 DOM i18n 引擎 (极简零开销，告别笨重硬编码字典)
    // -------------------------------------------------------------
    let currentLang = localStorage.getItem('webadb_lang') || 
                      (navigator.language && navigator.language.toLowerCase().startsWith('zh') ? 'zh' : 'en');

    function applyLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('webadb_lang', lang);
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

        // 纯声明式属性文本映射
        document.querySelectorAll('[data-en]').forEach(el => {
            if (!el.dataset.zh) el.dataset.zh = el.textContent;
            el.textContent = lang === 'en' ? el.dataset.en : el.dataset.zh;
        });
        document.querySelectorAll('[data-en-ph]').forEach(el => {
            if (!el.dataset.zhPh) el.dataset.zhPh = el.placeholder;
            el.placeholder = lang === 'en' ? el.dataset.enPh : el.dataset.zhPh;
        });
        document.querySelectorAll('optgroup[data-en-label]').forEach(el => {
            if (!el.dataset.zhLabel) el.dataset.zhLabel = el.label;
            el.label = lang === 'en' ? el.dataset.enLabel : el.dataset.zhLabel;
        });

        // 弹窗富文本
        document.getElementById('txtModalPriv').innerHTML = lang === 'en' 
            ? '<strong>Local Execution:</strong> Runs 100% locally in your browser. No telemetry or personal data are collected or transferred.'
            : '<strong>本地执行：</strong>本工具为 100% 纯前端浏览器本地运行，绝不上报或中转您的任何设备数据与个人隐私。';
        document.getElementById('txtModalRisk').innerHTML = lang === 'en'
            ? '<strong>Privilege Risk:</strong> ADB grants low-level device control. Execute commands at your own risk. The developer is not liable for system malfunctions.'
            : '<strong>特权风险：</strong>ADB 具备系统高阶调试权限，请谨慎执行自定义命令。因用户自行执行命令造成的任何异常，开发者概不负责。';

        document.getElementById('langToggleBtn').textContent = lang === 'zh' ? 'English' : '中文';
        if (device) updateConnectedStatus();
    }

    document.getElementById('langToggleBtn').onclick = () => {
        applyLanguage(currentLang === 'zh' ? 'en' : 'zh');
    };

    // -------------------------------------------------------------
    // DOM 元素与核心状态
    // -------------------------------------------------------------
    const app = document.getElementById('app');
    const statusText = document.getElementById('statusText');
    const deviceInfoCard = document.getElementById('deviceInfoCard');
    const infoModel = document.getElementById('infoModel');
    const infoAndroid = document.getElementById('infoAndroid');
    const infoBattery = document.getElementById('infoBattery');
    const infoSelinux = document.getElementById('infoSelinux');

    const connectBtn = document.getElementById('connectBtn');
    const presetSelect = document.getElementById('presetSelect');
    const cmdInput = document.getElementById('cmdInput');
    const execBtn = document.getElementById('execBtn');
    const clearBtn = document.getElementById('clearBtn');
    const logs = document.getElementById('logs');

    const disclaimerModal = document.getElementById('disclaimerModal');
    const agreeBtn = document.getElementById('agreeBtn');
    const disagreeBtn = document.getElementById('disagreeBtn');

    let adb = null;
    let device = null;
    let deviceName = '';
    let isAgreed = localStorage.getItem('adb_disclaimer_agreed') === 'true';

    // 严格使用 DOM 节点 + textContent，彻底根除 DOM-XSS 隐患
    function log(msg, type = 'info') {
        const time = new Date().toLocaleTimeString();
        const div = document.createElement('div');
        div.className = `log-item log-${type}`;
        
        const timeSpan = document.createElement('span');
        timeSpan.className = 'log-time';
        timeSpan.textContent = `[${time}] `;
        
        const msgSpan = document.createElement('span');
        msgSpan.textContent = msg;
        
        div.appendChild(timeSpan);
        div.appendChild(msgSpan);
        logs.appendChild(div);
        logs.scrollTop = logs.scrollHeight;
    }

    clearBtn.onclick = () => { logs.innerHTML = ''; };

    function ensureAgreed(callback) {
        if (isAgreed) {
            callback();
        } else {
            disclaimerModal.showModal();
            agreeBtn.onclick = () => {
                isAgreed = true;
                localStorage.setItem('adb_disclaimer_agreed', 'true');
                disclaimerModal.close();
                callback();
            };
            disagreeBtn.onclick = () => {
                disclaimerModal.close();
                log(currentLang === 'zh' ? '已取消连接授权。' : 'Device connection cancelled.', 'warn');
            };
        }
    }

    function updateConnectedStatus() {
        if (device) {
            statusText.textContent = `${currentLang === 'zh' ? '已连接: ' : 'Connected: '}${deviceName}`;
        }
    }

    // ADB 基础执行器
    async function execute(command) {
        if (!adb) {
            log(currentLang === 'zh' ? '请先连接设备！' : 'Please connect a device first!', 'warn');
            return null;
        }

        let cleanCmd = command.trim();
        if (cleanCmd.startsWith('adb shell ')) {
            cleanCmd = cleanCmd.replace(/^adb\s+shell\s+/, '');
        } else if (cleanCmd.startsWith('adb ')) {
            cleanCmd = cleanCmd.replace(/^adb\s+/, '');
        }

        try {
            // v2.1.0 的 spawnWaitText() 返回 ReadableStream<string> 文本流，
            // 并非 {stdout, stderr} 对象，必须逐块读取。
            const proto = adb.subprocess.shellProtocol?.isSupported
                ? adb.subprocess.shellProtocol
                : adb.subprocess.noneProtocol;

            const stream = proto.spawnWaitText(cleanCmd);
            const reader = stream.getReader();
            let output = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                output += value; // value 已是解码后的字符串
            }
            return output;
        } catch (err) {
            log(`${currentLang === 'zh' ? '执行异常: ' : 'Execution error: '}${err.message}`, 'err');
            return null;
        }
    }

    // 三级 Fallback 稳健定位并启动 Shizuku (解决 Toybox/精简版 Linux find 命令缺失)
    async function runShizukuSmart() {
        log(currentLang === 'zh' ? '正在多重检索 Shizuku 安装路径...' : 'Locating Shizuku installation across standard paths...', 'info');
        const pathRes = await execute('pm path moe.shizuku.privileged.api');
        const match = pathRes && pathRes.match(/package:(.+)\/base\.apk/);
        
        if (!match) {
            log(currentLang === 'zh' ? '未检测到安装的 Shizuku，请先在手机上安装该应用。' : 'Shizuku package not found on device.', 'warn');
            return;
        }

        const apkDir = match[1].trim();
        let soPath = '';

        // 1. 尝试直接探测常见 ABI 架构路径
        const candidatePaths = [
            `${apkDir}/lib/arm64/libshizuku.so`,
            `${apkDir}/lib/arm/libshizuku.so`,
            `${apkDir}/lib/x86_64/libshizuku.so`,
            `${apkDir}/lib/x86/libshizuku.so`
        ];

        for (const p of candidatePaths) {
            const check = (await execute(`ls ${p} 2>/dev/null`) || '').trim();
            if (check && check.endsWith('libshizuku.so')) {
                soPath = p;
                break;
            }
        }

        // 2. Fallback: 使用通配符 ls
        if (!soPath) {
            const lsCheck = (await execute(`ls ${apkDir}/lib/*/libshizuku.so 2>/dev/null`) || '').trim();
            if (lsCheck && lsCheck.includes('libshizuku.so')) {
                soPath = lsCheck.split('\n')[0].trim();
            }
        }

        // 3. Fallback: 使用 find
        if (!soPath) {
            const findCheck = (await execute(`find ${apkDir} -name "libshizuku.so" 2>/dev/null`) || '').trim();
            if (findCheck && findCheck.includes('libshizuku.so')) {
                soPath = findCheck.split('\n')[0].trim();
            }
        }

        if (!soPath) {
            log(currentLang === 'zh' ? '未能定位 libshizuku.so，建议更新 Shizuku 版本。' : 'Could not locate libshizuku.so. Please update Shizuku.', 'warn');
            return;
        }

        log(`> ${soPath}`, 'cmd');
        const out = await execute(soPath);
        if (out && out.includes('shizuku_server pid is')) {
            log(out.trim(), 'succ');
            log(currentLang === 'zh' ? 'Shizuku 启动成功！' : 'Shizuku started successfully!', 'succ');
        } else {
            log(out ? out.trim() : (currentLang === 'zh' ? '(命令已执行完毕，无返回输出)' : '(Command executed with no output)'), 'info');
        }
    }

    // 抓取硬件信息看板
    async function loadDeviceInfo() {
        try {
            const manufacturer = (await execute('getprop ro.product.manufacturer') || '').trim();
            const model = (await execute('getprop ro.product.model') || '').trim();
            const release = (await execute('getprop ro.build.version.release') || '').trim();
            const sdk = (await execute('getprop ro.build.version.sdk') || '').trim();
            const selinux = (await execute('getenforce') || '').trim();
            const batteryDump = await execute('dumpsys battery') || '';
            
            let levelMatch = batteryDump.match(/level:\s*(\d+)/);
            let batteryStr = levelMatch ? `${levelMatch[1]}%` : (currentLang === 'zh' ? '正常' : 'Normal');

            infoModel.innerText = `${manufacturer} ${model}`.trim() || (currentLang === 'zh' ? '未知设备' : 'Unknown Device');
            infoAndroid.innerText = `Android ${release} (API ${sdk})`;
            infoBattery.innerText = batteryStr;
            infoSelinux.innerText = selinux || (currentLang === 'zh' ? '未知' : 'Unknown');

            deviceInfoCard.style.display = 'grid';
        } catch (e) {
            console.error(e);
        }
    }

    // WebUSB 连接
    async function doConnect() {
        if (!navigator.usb) {
            log(currentLang === 'zh' ? '当前浏览器不支持 WebUSB，请使用桌面 Chrome 或 Edge，并通过 HTTPS 或 localhost 访问本页面！' : 'WebUSB is not supported in this browser. Use desktop Chrome or Edge over HTTPS (or localhost).', 'err');
            return;
        }
        if (!AdbDaemonWebUsbDeviceManager.BROWSER) {
            log(currentLang === 'zh' ? 'WebUSB 管理器不可用，请确认当前为安全上下文 (HTTPS)。' : 'WebUSB manager unavailable. Ensure a secure context (HTTPS).', 'err');
            return;
        }
        try {
            device = await AdbDaemonWebUsbDeviceManager.BROWSER.requestDevice();
            if (!device) return log(currentLang === 'zh' ? '未选择任何 ADB 设备（可能已取消，或未找到可用的调试设备）。' : 'No ADB device selected or found.', 'warn');

            const connection = await device.connect();
            const credentialStore = new AdbWebCredentialStore();
            const transport = await AdbDaemonTransport.authenticate({
                serial: device.serial,
                connection: connection,
                credentialStore: credentialStore,
            });

            adb = new Adb(transport);
            deviceName = (device.raw?.manufacturerName || 'Android') + ' ' + (device.raw?.productName || 'Device');
            
            app.classList.add('connected');
            updateConnectedStatus();
            log(`${currentLang === 'zh' ? '已连接: ' : 'Connected: '}${deviceName}`, 'succ');
            log(currentLang === 'zh' ? '若手机弹出“允许 USB 调试”，请在手机上点击“确定”。' : 'If prompted on device, please tap "Allow USB debugging".', 'warn');

            await loadDeviceInfo();
        } catch (err) {
            log(`${currentLang === 'zh' ? '连接失败: ' : 'Connection failed: '}${err.message}`, 'err');
            adb = null;
            device = null;
            app.classList.remove('connected');
            statusText.textContent = currentLang === 'zh' ? '未连接' : 'Disconnected';
            deviceInfoCard.style.display = 'none';
        }
    }

    connectBtn.onclick = () => ensureAgreed(doConnect);

    // 执行按钮
    async function handleExec() {
        const val = cmdInput.value.trim();
        if (!val) {
            log(currentLang === 'zh' ? '请输入或选择要执行的命令！' : 'Please enter or select a command.', 'warn');
            return;
        }

        if (!adb) {
            ensureAgreed(doConnect);
            return;
        }

        // 解耦的动作分发
        const isShizukuAction = cmdInput.dataset.action === 'shizuku' || 
                                val === 'shizuku start' || 
                                val.toLowerCase() === 'shizuku';

        if (isShizukuAction) {
            await runShizukuSmart();
            return;
        }

        log(`> ${val}`, 'cmd');
        const res = await execute(val);
        if (res !== null) {
            if (res.trim()) {
                log(res.trim(), 'succ');
            } else {
                log(currentLang === 'zh' ? '(命令已执行完毕，无返回输出)' : '(Command executed with no output)', 'info');
            }
        }
    }

    execBtn.onclick = handleExec;
    cmdInput.onkeydown = (e) => { if (e.key === 'Enter') handleExec(); };

    // 用户在输入框打字修改时，立即解除预设 Action 绑定
    cmdInput.oninput = () => {
        delete cmdInput.dataset.action;
    };

    // 下拉预设选择
    presetSelect.onchange = () => {
        const val = presetSelect.value;
        if (!val) return;
        
        if (val === 'action:shizuku') {
            cmdInput.dataset.action = 'shizuku';
            cmdInput.value = 'shizuku start';
        } else {
            delete cmdInput.dataset.action;
            cmdInput.value = val;
        }
        cmdInput.focus();
    };

    // 监听 USB 拔出事件
    if (navigator.usb) {
        navigator.usb.addEventListener("disconnect", (e) => {
            if (device && e.device === device.raw) {
                adb = null;
                device = null;
                app.classList.remove('connected');
                statusText.textContent = currentLang === 'zh' ? '未连接' : 'Disconnected';
                deviceInfoCard.style.display = 'none';
                log(currentLang === 'zh' ? '设备已断开连接。' : 'Device disconnected.', 'warn');
            }
        });
    }

    // 初始化语言
    applyLanguage(currentLang);
    log(currentLang === 'zh' ? '控制台已就绪，请点击上方【连接设备】开始。' : 'Console ready. Tap [Connect Device] to begin.', 'info');
</script>
